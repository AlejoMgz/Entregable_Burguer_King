{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel | Burger King</title>
    <link rel="icon" href="../static/img/logo_bk.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 panel-lateral p-2">
                <div class="marca"><img src="{% static 'img/logo.png' %}" height="36"> Panel BK</div>
                <a href="{% url 'panel_dashboard' %}" class="{% if not activo %}activo{% endif %}">
                    <i class="bi bi-speedometer2"></i> Inicio</a>
                {% for slug, m in menu.items %}
                <a href="{% url 'panel_lista' slug %}" class="{% if activo == slug %}activo{% endif %}">
                    <i class="bi {{ m.icono }}"></i> {{ m.titulo }}</a>
                {% endfor %}
                <hr class="border-secondary">
                <a href="{% url 'home' %}"><i class="bi bi-globe"></i> Ver sitio web</a>
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}
                    <button class="btn btn-link text-white text-decoration-none w-100 text-start">
                        <i class="bi bi-box-arrow-left"></i> Cerrar sesión</button>
                </form>
            </aside>
            <section class="col-md-10 p-4">
                {% for m in messages %}
                <div class="alert alert-{{ m.tags }} alert-dismissible fade show auto-cerrar">
                    {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
                {% block contenido %}{% endblock %}
            </section>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
